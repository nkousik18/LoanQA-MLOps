# ============================================================
# LoanDoc AI — Cloud Build CI/CD Pipeline (VM Deployment)
# ============================================================

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: ALLOW_LOOSE

steps:

# ------------------------------------------------------------
# 1. Enable Multi-Platform Docker Builder
# ------------------------------------------------------------
- name: gcr.io/cloud-builders/docker
  entrypoint: "bash"
  args:
    - "-c"
    - |
      docker buildx create --use --name llm_builder
      docker buildx inspect --bootstrap

# ------------------------------------------------------------
# 2. Build + Push Image to Artifact Registry
# ------------------------------------------------------------
- name: gcr.io/cloud-builders/docker
  args:
    [
      "buildx", "build",
      "--platform=linux/amd64",
      "-t", "us-east1-docker.pkg.dev/$PROJECT_ID/loan-llm-ms/llm-microservice:latest",
      "--push",
      "."
    ]

# ------------------------------------------------------------
# 3. SSH into VM and run restart.sh
# ------------------------------------------------------------
- name: gcr.io/cloud-builders/gcloud
  args:
    [
      "compute", "ssh", "ash_ketchum3847_gmail_com@ollama-l4-vm",
      "--zone=us-east1-b",
      "--project=$PROJECT_ID",
      "--command=bash /home/ash_ketchum3847_gmail_com/loan-doc-ai-inference/llm-microservice/deploy/restart.sh"
    ]

# ------------------------------------------------------------
# 4. Record built image
# ------------------------------------------------------------
images:
  - "us-east1-docker.pkg.dev/$PROJECT_ID/loan-llm-ms/llm-microservice:latest"
