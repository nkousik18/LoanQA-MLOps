global:
  scrape_interval: 3s

scrape_configs:

  - job_name: "llm_api"
    static_configs:
      - targets: ["localhost:8001"]   # your Python FastAPI server (if different)

  - job_name: "vllm"
    static_configs:
      - targets: ["localhost:8000"]   # vLLM inference server

  - job_name: "custom_llm_metrics"
    static_configs:
      - targets: ["localhost:9101"]   # if you expose custom metrics here

  - job_name: "llm_microservice"
    static_configs:
      - targets: ["localhost:8000"]   # same as LLM API if all in one
