version: '3.8'

services:
  loanqa-service:
    build:
      context: ./llm-microservice
      dockerfile: Dockerfile
    container_name: loanqa_runner

    # Load your AWS keys automatically from the root .env
    env_file:
      - .env

    volumes:
      # Map the 'scripts' folder so the container can see your extraction code
      - ./scripts:/app/scripts
      # Map 'data' so it can save PDFs locally if needed
      - ./data:/app/data
      # Map the Google Key (if you have it)
      - ./gcp_keys/doc-understand-7f714b3c6924.json:/app/gcs_key.json

    # Set PYTHONPATH so Python knows where to find 'scripts'
    environment:
      - PYTHONPATH=/app