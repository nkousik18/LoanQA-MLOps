[pytest]
# ---------------------------------------------------------------------
# 🔧 Paths & discovery
# ---------------------------------------------------------------------
pythonpath = .
testpaths = tests
python_files = test_*.py

# ---------------------------------------------------------------------
# 🧩 Options
# ---------------------------------------------------------------------
addopts = -v --disable-warnings -ra

# ---------------------------------------------------------------------
# 🧾 Logging output
# ---------------------------------------------------------------------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
