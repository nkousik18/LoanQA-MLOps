# cloudbuild.yaml
# Google Cloud Build configuration for Doc-Understand
# Automates: Build → Push → Deploy to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-understand:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
    id: 'push-image-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-understand:latest'
    id: 'push-image-latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'doc-understand'
      - '--image=gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--max-instances=10'
      - '--set-env-vars=USE_GCS_OUTPUT=true'
    id: 'deploy-cloud-run'

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/doc-understand:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/doc-understand:latest'

# Build timeout
timeout: '1200s'

# Options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
