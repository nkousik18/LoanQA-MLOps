<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Docs Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Loan Docs Assistant</h3>

    <!-- Text area for input / PDF text -->
    <textarea id="inputText" placeholder="Upload a PDF or type text here..."></textarea>

    <!-- Buttons -->
    <div class="button-container">
        <button id="uploadBtn"><img src="upload_icon.png" class="icon"> Upload</button>
        <button id="summarizeBtn"><img src="summarize_icon.png" class="icon"> Summarize</button>
        <button id="mathBtn"><img src="calculate_icon.png" class="icon"> Math Explain</button>
        <button id="ttsBtn"><img src="voice_icon.png" class="icon"> Voice Assistant</button>
    </div>

    <!-- Output -->
    <div id="output"></div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.102/pdf.min.js"></script>

    <!-- Custom JS -->
    <script src="popup.js"></script>
</body>
</html>
